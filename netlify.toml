# Netlify deploy config.
# The quote form works out of the box here — Netlify Forms handles the photo
# upload with no backend code. See README section 4 if deploying elsewhere.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Service redirects ────────────────────────────────────────────────────────
# Each main service now has its own real page at /services/<slug>, so the old
# "redirect to an anchor" rules are gone. What remains maps retired slugs onto
# the page that now covers them.
[[redirects]]
  from = "/services/treadmill-removal"
  to = "/services/furniture-removal"
  status = 301
[[redirects]]
  from = "/services/garage-cleanouts"
  to = "/services/garage-basement-attic-cleanouts"
  status = 301
[[redirects]]
  from = "/services/shed-removal"
  to = "/services/yard-waste-removal"
  status = 301
[[redirects]]
  from = "/services/commercial-cleanouts"
  to = "/commercial"
  status = 301
[[redirects]]
  from = "/services/pre-listing-cleanouts"
  to = "/commercial"
  status = 301
[[redirects]]
  from = "/services/remodeler-property-manager-hauling"
  to = "/commercial"
  status = 301

# Old city × service pages → the city page.
[[redirects]]
  from = "/locations/:city/:service"
  to = "/locations/:city"
  status = 301

# Blog removed.
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

# Long-cache the fingerprinted asset bundle; Astro hashes these filenames.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML must revalidate so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep deploy previews out of the index so they never compete with the live site.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex"
